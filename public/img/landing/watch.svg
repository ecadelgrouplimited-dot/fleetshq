<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" fill="none" role="img" aria-label="The platform scans every record every day and catches what is about to expire">
  <defs>
    <radialGradient id="w-sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14233c"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <filter id="w-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- radar field -->
  <circle cx="230" cy="180" r="168" fill="#0a1526" stroke="#1e3354" stroke-width="1.5"/>
  <circle cx="230" cy="180" r="120" fill="none" stroke="#1e3354" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="230" cy="180" r="64" fill="none" stroke="#1e3354" stroke-width="1" stroke-opacity="0.6"/>

  <!-- rotating sweep -->
  <g>
    <path d="M230 180 L230 12 A168 168 0 0 1 376 96 Z" fill="url(#w-sweep)"/>
    <line x1="230" y1="180" x2="230" y2="12" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.7"/>
    <animateTransform attributeName="transform" type="rotate" from="0 230 180" to="360 230 180" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- grid of monitored records -->
  <!-- each tile is a record: vehicle / driver / document. Most are green (compliant). -->
  <g font-family="Inter, sans-serif">
    <!-- row 1 -->
    <g transform="translate(150 96)">
      <rect width="44" height="44" rx="9" fill="url(#w-tile)" stroke="#10b981" stroke-opacity="0.5"/>
      <path d="M14 22l6 6 11-13" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <g transform="translate(208 96)">
      <rect width="44" height="44" rx="9" fill="url(#w-tile)" stroke="#10b981" stroke-opacity="0.5"/>
      <path d="M14 22l6 6 11-13" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <g transform="translate(266 96)">
      <rect width="44" height="44" rx="9" fill="url(#w-tile)" stroke="#10b981" stroke-opacity="0.5"/>
      <path d="M14 22l6 6 11-13" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- row 2 -->
    <g transform="translate(150 154)">
      <rect width="44" height="44" rx="9" fill="url(#w-tile)" stroke="#10b981" stroke-opacity="0.5"/>
      <path d="M14 22l6 6 11-13" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <!-- THE CATCH: an expiring record, flagged amber -->
    <g transform="translate(208 154)">
      <rect width="44" height="44" rx="9" fill="#231a07" stroke="#f59e0b" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="22" cy="14" r="9" fill="#f59e0b" filter="url(#w-soft)" opacity="0.8"/>
      <path d="M22 9v7m0 4v0.5" stroke="#1a1205" stroke-width="3" stroke-linecap="round"/>
      <text x="22" y="38" font-size="7" fill="#fbbf24" text-anchor="middle" font-weight="700">14 DAYS</text>
    </g>
    <g transform="translate(266 154)">
      <rect width="44" height="44" rx="9" fill="url(#w-tile)" stroke="#10b981" stroke-opacity="0.5"/>
      <path d="M14 22l6 6 11-13" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- row 3 -->
    <g transform="translate(150 212)">
      <rect width="44" height="44" rx="9" fill="url(#w-tile)" stroke="#10b981" stroke-opacity="0.5"/>
      <path d="M14 22l6 6 11-13" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <g transform="translate(208 212)">
      <rect width="44" height="44" rx="9" fill="url(#w-tile)" stroke="#10b981" stroke-opacity="0.5"/>
      <path d="M14 22l6 6 11-13" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <g transform="translate(266 212)">
      <rect width="44" height="44" rx="9" fill="url(#w-tile)" stroke="#10b981" stroke-opacity="0.5"/>
      <path d="M14 22l6 6 11-13" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- alert pulse emanating from the caught tile -->
  <circle cx="230" cy="176" r="30" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="20;60" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
