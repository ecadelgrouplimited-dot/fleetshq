<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" fill="none" role="img" aria-label="One click assembles a complete, audit-ready evidence pack">
  <defs>
    <linearGradient id="e-folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="e-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <radialGradient id="e-seal" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </radialGradient>
    <filter id="e-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a1628" flood-opacity="0.5"/>
    </filter>
    <filter id="e-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- papers sliding into the pack -->
  <g filter="url(#e-shadow)">
    <g transform="rotate(-8 150 150)">
      <rect x="96" y="74" width="120" height="150" rx="8" fill="url(#e-paper)"/>
      <rect x="112" y="96" width="64" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="112" y="112" width="88" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="112" y="126" width="80" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="112" y="140" width="88" height="6" rx="3" fill="#e2e8f0"/>
      <circle cx="124" cy="196" r="13" fill="#d1fae5"/>
      <path d="M118 196l4 4 8-9" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <g transform="rotate(6 290 150)">
      <rect x="236" y="68" width="120" height="150" rx="8" fill="url(#e-paper)"/>
      <rect x="252" y="90" width="58" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="252" y="106" width="88" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="252" y="120" width="76" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="252" y="134" width="88" height="6" rx="3" fill="#e2e8f0"/>
      <circle cx="264" cy="190" r="13" fill="#d1fae5"/>
      <path d="M258 190l4 4 8-9" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- the audit folder -->
  <g filter="url(#e-shadow)">
    <path d="M104 188h70l16 16h142a14 14 0 0114 14v104a14 14 0 01-14 14H104a14 14 0 01-14-14V202a14 14 0 0114-14z" fill="url(#e-folder)"/>
    <path d="M90 226h356v92a14 14 0 01-14 14H104a14 14 0 01-14-14z" fill="#2563eb" fill-opacity="0.55"/>
    <rect x="90" y="226" width="356" height="3" fill="#93c5fd" fill-opacity="0.4"/>
  </g>

  <!-- compliance seal -->
  <g transform="translate(330 250)" filter="url(#e-glow)">
    <circle r="34" fill="url(#e-seal)"/>
    <circle r="34" fill="none" stroke="#ecfdf5" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle r="26" fill="none" stroke="#ecfdf5" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="M-12 1l8 8 17-19" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- label -->
  <text x="118" y="290" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#eff6ff">AUDIT PACK</text>
  <text x="118" y="310" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#bfdbfe" letter-spacing="0.5">DVSA · Home Office · Ready</text>
</svg>
