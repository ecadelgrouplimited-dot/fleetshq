<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" fill="none" role="img" aria-label="Articulated HGV lorry">
  <defs>
    <linearGradient id="t-trailer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2c4a"/>
      <stop offset="1" stop-color="#0e1c32"/>
    </linearGradient>
    <linearGradient id="t-cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="t-road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3354" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1e3354"/>
      <stop offset="1" stop-color="#1e3354" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- road -->
  <rect x="0" y="196" width="560" height="3" rx="1.5" fill="url(#t-road)"/>
  <g stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5">
    <line x1="60" y1="216" x2="110" y2="216">
      <animate attributeName="x1" values="60;-40" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="110;10" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="216" x2="230" y2="216">
      <animate attributeName="x1" values="180;80" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="230;130" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="216" x2="350" y2="216">
      <animate attributeName="x1" values="300;200" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="350;250" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="420" y1="216" x2="470" y2="216">
      <animate attributeName="x1" values="420;320" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="470;370" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="540" y1="216" x2="590" y2="216">
      <animate attributeName="x1" values="540;440" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="590;490" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- trailer -->
  <rect x="176" y="58" width="296" height="120" rx="8" fill="url(#t-trailer)" stroke="#2f4a73" stroke-width="2"/>
  <line x1="176" y1="92" x2="472" y2="92" stroke="#2f4a73" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="300" y1="58" x2="300" y2="178" stroke="#2f4a73" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="388" y1="58" x2="388" y2="178" stroke="#2f4a73" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- subtle 256 mark on trailer -->
  <text x="324" y="138" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#3b82f6" fill-opacity="0.22" letter-spacing="2">256</text>

  <!-- cab -->
  <path d="M64 96c0-6 5-11 11-11h56c4 0 8 2 10 6l22 36v51c0 4-3 7-7 7H72c-4 0-8-3-8-8z" fill="url(#t-cab)" stroke="#1e40af" stroke-width="2"/>
  <!-- windscreen -->
  <path d="M120 96h14l18 30h-32z" fill="#bfdbfe" fill-opacity="0.85"/>
  <!-- headlight -->
  <rect x="64" y="150" width="9" height="14" rx="3" fill="#fde68a"/>
  <circle cx="68" cy="157" r="14" fill="#fde68a" fill-opacity="0.18"/>

  <!-- wheels -->
  <g>
    <circle cx="118" cy="186" r="26" fill="#0a1424" stroke="#2f4a73" stroke-width="3"/>
    <circle cx="118" cy="186" r="11" fill="#16243d" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <g>
    <circle cx="332" cy="186" r="26" fill="#0a1424" stroke="#2f4a73" stroke-width="3"/>
    <circle cx="332" cy="186" r="11" fill="#16243d" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <g>
    <circle cx="404" cy="186" r="26" fill="#0a1424" stroke="#2f4a73" stroke-width="3"/>
    <circle cx="404" cy="186" r="11" fill="#16243d" stroke="#3b82f6" stroke-width="2"/>
  </g>
</svg>
