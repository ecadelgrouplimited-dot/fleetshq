<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" fill="none" role="img" aria-label="ECADEL Group emblem">
  <defs>
    <linearGradient id="ec-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ec-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16243d"/>
      <stop offset="1" stop-color="#0a1424"/>
    </linearGradient>
    <radialGradient id="ec-sheen" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fffbeb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fffbeb" stop-opacity="0"/>
    </radialGradient>
    <filter id="ec-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- hexagon seal -->
  <path d="M44 4l34 20v40L44 84 10 64V24z" fill="url(#ec-bg)" stroke="url(#ec-gold)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M44 4l34 20v40L44 84 10 64V24z" fill="url(#ec-sheen)"/>

  <!-- inner seal ring -->
  <path d="M44 13l27 16v30L44 75 17 59V29z" fill="none" stroke="url(#ec-gold)" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="1.5 4" stroke-linejoin="round"/>

  <!-- architectural monogram E — three rising beams on a spine -->
  <g filter="url(#ec-glow)">
    <rect x="33" y="28" width="5.5" height="32" rx="2" fill="url(#ec-gold)"/>
    <rect x="33" y="28" width="26" height="5.5" rx="2.5" fill="url(#ec-gold)"/>
    <rect x="33" y="41.25" width="19" height="5.5" rx="2.5" fill="url(#ec-gold)"/>
    <rect x="33" y="54.5" width="26" height="5.5" rx="2.5" fill="url(#ec-gold)"/>
    <!-- the soul: a spark node -->
    <circle cx="62" cy="30.75" r="3.4" fill="#fef3c7"/>
    <circle cx="62" cy="30.75" r="3.4" fill="none" stroke="url(#ec-gold)" stroke-width="1"/>
  </g>
</svg>
